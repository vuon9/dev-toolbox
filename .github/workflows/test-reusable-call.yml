name: test-reusable-call

on:
  workflow_call:
    inputs:
      mode:
        required: false
        type: string
        default: pr
      model:
        required: false
        type: string
        default: opencode/muse-spark-1.2-contributor-free
      prompt:
        required: false
        type: string
        default: ''
    secrets:
      OPENCODE_API_KEY:
        required: true

jobs:
  test:
    if: |
      (inputs.mode == 'pr' && github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (inputs.mode == 'comment' && (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare review prompt
        id: prompt
        shell: bash
        run: |
          PROMPT="${{ inputs.prompt }}"
          if [ -z "$PROMPT" ]; then PROMPT="$DEFAULT_PROMPT"; fi
          printf '%s\n' "$PROMPT" > /tmp/review-prompt.txt
          {
            echo "value<<PROMPT_EOF"
            cat /tmp/review-prompt.txt
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          DEFAULT_PROMPT: |
            Review this pull request thoroughly:
            - Check for bugs, logic errors and edge cases
            - Look for security issues and unsafe patterns
            - Assess code quality, consistency and maintainability
            - Flag missing or weak tests
            - Suggest concrete improvements
            Post a clear, structured review comment with file references.
      - run: echo "mode=${{ inputs.mode }} model=${{ inputs.model }} prompt=${{ steps.prompt.outputs.value }}"
