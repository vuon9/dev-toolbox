name: test-reusable-call

on:
  workflow_call:
    inputs:
      mode:
        required: false
        type: string
        default: pr
      model:
        required: false
        type: string
        default: opencode-go/hy3
      prompt:
        required: false
        type: string
        default: ''
    secrets:
      OPENCODE_API_KEY:
        required: true

jobs:
  test:
    if: |
      (inputs.mode == 'pr' && github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (inputs.mode == 'comment' && (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: read
    steps:
      - name: Get opencode version
        id: version
        shell: bash
        run: |
          VERSION=$(curl -sf https://api.github.com/repos/anomalyco/opencode/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
          echo "version=${VERSION:-latest}" >> "$GITHUB_OUTPUT"
      - run: echo "done mode=${{ inputs.mode }} version=${{ steps.version.outputs.version }}"
