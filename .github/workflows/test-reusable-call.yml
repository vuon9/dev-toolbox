name: test-reusable-call

on:
  workflow_call:
    inputs:
      mode:
        required: false
        type: string
        default: pr
    secrets:
      OPENCODE_API_KEY:
        required: true

jobs:
  test:
    if: |
      (inputs.mode == 'pr' && github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (inputs.mode == 'comment' && (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: read
    steps:
      - name: Set output
        id: out
        shell: bash
        run: echo "foo=bar" >> "$GITHUB_OUTPUT"
      - run: echo "done foo=${{ steps.out.outputs.foo }} mode=${{ inputs.mode }}"
