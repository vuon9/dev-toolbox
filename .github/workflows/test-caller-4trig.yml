name: test-caller-4trig

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review-pr:
    uses: ./.github/workflows/opencode-review-reusable.yml
    with:
      mode: pr
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

  on-demand:
    uses: ./.github/workflows/opencode-review-reusable.yml
    with:
      mode: comment
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
