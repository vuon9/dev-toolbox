name: opencode-review

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Dispatcher: delegates to the reusable workflow so the review logic lives
# in one place (opencode-review-reusable.yml) and can be reused by other repos.
# GitHub does not allow `if:` conditions on jobs that use a reusable workflow,
# so the pr/comment gating lives inside the reusable workflow via the `mode` input.
jobs:
  review-pr:
    uses: ./.github/workflows/opencode-review-reusable.yml
    with:
      mode: pr
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

  on-demand:
    uses: ./.github/workflows/opencode-review-reusable.yml
    with:
      mode: comment
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
